<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>منصة التسويق بالعمولة</title>
<style>
body{margin:0;background:#f6f7fb}
</style>
</head>
<body>
<!-- جميع الحقوق محفوظة لصاحب المتجر — يُمنع إعادة رفع هذا الملف على أي استضافة أخرى دون إذن -->
<div dir="rtl" lang="ar" id="storeRoot">
  <header class="topbar">
    <div class="topbar-inner top-main">
      <div class="logo">منصة التسويق بالعمولة <span class="logo-dot">✦</span></div>
            <div class="top-actions">
        <div class="add-menu-wrap" id="addMenuWrap">
        <button id="addBtn" class="create-btn">➕ إضافة منتج ▾</button>
        <div id="addMenu" class="add-menu" hidden>
        <button id="addOneBtn">🔗 إضافة رابط منتج</button>
        <button id="addBulkBtn">📦 إضافة روابط منتجات دفعة واحدة</button>
        <button id="addSiteBtn">🏬 إضافة موقع متجر</button>
        </div>
        </div>
        <button id="shareBtn" class="create-btn">🌐 مشاركة</button>
        <button id="backupBtn" class="create-btn">💾 نسخة احتياطية</button>
        <button id="delAllBtn" class="create-btn del-all-btn">🗑 حذف الكل</button>
      </div>
    </div>
    <nav id="catNav" class="cats"></nav>
    <div class="topbar-inner top-filters">
      <div class="filters-row">
        <select id="sortSelect" aria-label="ترتيب">
        <option value="pop">الأكثر شعبية</option>
        <option value="new">الأحدث 🆕</option>
        <option value="cheap">السعر: من الأقل</option>
        <option value="exp">السعر: من الأعلى</option>
        <option value="rate">الأعلى تقييماً</option>
        </select>
        <select id="sizeSelect" aria-label="حجم العرض">
        <option value="s">حجم صغير</option>
        <option value="m">حجم متوسط</option>
        <option value="l">حجم كبير</option>
        </select>
        <select id="geoCountry" aria-label="الدولة"><option value="ALL">كل الدول</option></select>
        <select id="geoCity" aria-label="المدينة"><option value="ALL">كل المدن</option></select>
        <select id="geoCur" aria-label="العملة"><option value="ALL">كل العملات</option></select>
      </div>
      <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="ابحث عن منتج… (سماعات، عطر، مصباح)" autocomplete="off" />
      <span class="search-ico">🔍</span>
      </div>
    </div>
  </header>

  <section class="hero">
    <div>
      <div class="hero-kicker">تصفح أفضل منتجات التسويق بالعمولة</div>
      <h2>كل ما تحتاجه، <span>في مكان واحد</span></h2>
      <div class="hero-btns">
        <button id="shopNowBtn" class="btn primary">تسوّق الآن</button>
        <button id="dealsBtn" class="btn ghost">عرض الخصومات</button>
      </div>
    </div>
    <div class="hero-art" aria-hidden="true">
      <div class="float f1">🎧</div>
      <div class="float f2">⌚</div>
      <div class="float f3">🕯️</div>
      <div class="float f4">👟</div>
    </div>
  </section>

  <main class="wrap">
    <div id="resultInfoEl" class="result-info"></div>
    <div id="productsGridEl" class="grid"></div>
  </main>

  <footer class="foot">
    <div>© منصة التسويق بالعمولة — الشراء يتم في مواقع البائعين الأصلية.</div>
    <div class="foot-sub">الأسعار استرشادية من المواقع الأصلية • الشراء يتم في موقع البائع • <span id="yearEl"></span></div>
  </footer>

  <div id="modalOverlay" class="overlay center" hidden>
    <div id="modalBox" class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toastCtn" class="toasts"></div>
</div>

function absUrl(u,base){try{return new URL(u,base).href;}catch(e){return "";}}
function tryAsImage(u){return new Promise(function(res){var im=new Image();var done=false;var to=setTimeout(function(){if(!done){done=true;res(false);}},5000);im.onload=function(){if(!done){done=true;clearTimeout(to);res(true);}};im.onerror=function(){if(!done){done=true;clearTimeout(to);res(false);}};im.src=u;});}
function collectPageImages(doc,base,firsts){
  var scored=[];var seen={};
  function abs(u){try{return new URL(u,base).href;}catch(e){return "";}}
  function push(u,score,alt){
    u=(u||"").trim();
    if(!u||u.indexOf("data:")===0)return;
    if(/pixel|beacon|track|spacer|1x1|blank\.gif|captcha/i.test(u))return;
    if(/\.(mp4|webm|ogv|mov|m3u8|mp3|wav)(\?|#|$)/i.test(u.split("?")[0]))return;
    if(isLogoImg(u,alt))return;
    if(/(^|[\/\\\-_\.])icons?([\/\\\-_\.]|$)/i.test(u.toLowerCase()))return;
    u=abs(u);
    if(!u||seen[u])return;
    seen[u]=1;
    scored.push({u:u,s:score});
  }
  var fa=Array.isArray(firsts)?firsts:(firsts?[firsts]:[]);
  for(var fi=0;fi<fa.length;fi++)push(fa[fi],10,"");
  function scoreAncestors(n){
    var skip=false;var boost=0;var el=n.parentElement;var depth=0;
    while(el&&depth<6){
      var tn=(el.tagName||"").toLowerCase();
      var cs="";
      try{cs=String(el.className||"")+" "+String(el.id||"");}catch(e){cs="";}
      cs=cs.toLowerCase();
      if(tn==="header"||tn==="footer"||tn==="nav"){skip=true;break;}
      if(/header|footer|navbar|logo|banner|hero|sidebar|advert|promo|related/.test(cs)){skip=true;break;}
      if(/product|galler|main|content|detail|article|zoom/.test(cs))boost+=2;
      el=el.parentElement;depth++;
    }
    return {skip:skip,boost:boost};
  }
  var nodes=doc.querySelectorAll("img");
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    var s=imgAttrUrl(n);
    s=(s||"").trim();
    if(!s||s.indexOf("data:")===0)continue;
    var alt=n.getAttribute("alt")||"";
    var sab=scoreAncestors(n);
    if(sab.skip)continue;
    var w=parseInt(n.getAttribute("width")||"0",10)||0;
    var hh=parseInt(n.getAttribute("height")||"0",10)||0;
    var sc=sab.boost;
    if(w>=400||hh>=400)sc+=3;
    else if(w>=200||hh>=200)sc+=1;
    else if((w>0&&w<60)||(hh>0&&hh<60))sc-=5;
    if(/product|large|zoom|full|original|master/i.test(s))sc+=2;
    push(s,sc,alt);
  }
  var srcs=doc.querySelectorAll("source");
  for(var si=0;si<srcs.length;si++){
    var su=imgAttrUrl(srcs[si]);
    if(!su)continue;
    var scs=scoreAncestors(srcs[si]);
    if(scs.skip)continue;
    push(su,scs.boost,"");
  }
  var bgs=doc.querySelectorAll('[style*="url"],[style*="URL"],[data-bg],[data-background]');
  for(var bi=0;bi<bgs.length;bi++){
    var bu=bgStyleUrl(bgs[bi]);
    if(!bu){try{bu=bgs[bi].getAttribute("data-bg")||bgs[bi].getAttribute("data-background")||"";}catch(e){bu="";}}
    if(!bu)continue;
    var scb=scoreAncestors(bgs[bi]);
    if(scb.skip)continue;
    push(bu,scb.boost,"");
  }
  scored.sort(function(a,b){return b.s-a.s;});
  var res=[];
  for(var j=0;j<scored.length;j++)res.push(scored[j].u);
  return res;
}

function geoWireEntry(cCtry,cCity,cCustom,cCur){
  var cs=document.getElementById(cCtry),ct=document.getElementById(cCity),ci=document.getElementById(cCustom),cu=document.getElementById(cCur);

  cs.onchange=function(){
    var code=cs.value;
    try{geoCityOptions(ct,code,"","غير محدد",true);}catch(e){}
    try{ct.disabled=!code;}catch(e){}
    try{if(ci){ci.hidden=true;ci.value="";}}catch(e){}

}

function scanCropRect(nx,ny,nw,nh){

function extractAffQuery(aff){

    toAdd.push(parts[i]);

function buildMirror(){
  var prods=[],seen={};
  var ids=Object.keys(_s.items||{}).sort();
  for(var i=0;i<ids.length;i++)buildMirrorInner(prods,seen,_s.items[ids[i]]);
  var fd={};for(var f=0;f<(_s.fixedDel||[]).length;f++)fd[_s.fixedDel[f]]=1;

function scheduleMirrorPublish(){if(_mirrorT)clearTimeout(_mirrorT);_mirrorT=setTimeout(function(){_mirrorT=null;publishMirrorNow(false);},15000);publishMirrorNow(false);}
async function publishMirrorNow(manual){
  if(_mirrorBusy){if(manual){toast("النشر مشغول — سيُعاد تلقائياً");scheduleMirrorPublish();}return {ok:false,reason:"busy"};}
  if(!_sFresh){if(manual)toast("جارٍ تحميل السوق المشترك — انتظر ثوانٍ ثم أعد النشر");return {ok:false,reason:"not-fresh"};}
  _mirrorBusy=true;
  try{
    var txt=JSON.stringify(buildMirror());
    var h=hashStr(txt);
    var last="";try{last=localStorage.getItem("nour_mirror_hash_v1")||"";}catch(e){}
    if(h===last&&!manual){_mirrorBusy=false;return {ok:true,skipped:true};}
    var r;
    var k="";try{k=localStorage.getItem("nour_mirror_key_v1")||MIRROR_KEY||"";}catch(e){k=MIRROR_KEY||"";}
    if(k)r=await root.uploadPlugin.editable.set(MIRROR_NAME,txt,{editKey:k});
    else r=await root.uploadPlugin.editable.set(MIRROR_NAME,txt);
    if(r&&r.error)throw new Error(r.error);
    if(r&&r.editKey){try{localStorage.setItem("nour_mirror_key_v1",r.editKey);}catch(e){}}
    try{localStorage.setItem("nour_mirror_hash_v1",h);}catch(e){}
    _mirrorBusy=false;
    if(manual)toast("تم نشر نسخة المدونة 🌐✅");
    return {ok:true,url:mirrorUrl(),bytes:txt.length,editCount:(r&&r.editCount)||null};
  }catch(e){_mirrorBusy=false;if(manual)toast("تعذر النشر: "+((e&&e.message)||e));return {ok:false,reason:String((e&&e.message)||e)};}
}

function importBackupFile(f){
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(rd.result);
      if(!o||o.v!==1||!o.customProducts)throw new Error("bad");
      if(!confirm("استيراد النسخة؟ سيستبدل منتجاتك وبياناتك الحالية في هذا الجهاز ("+o.customProducts.length+" منتج)."))return;
      customProducts=o.customProducts||[];saveCustom();
      productEdits=o.productEdits||{};saveEdits();
      deletedIds=o.deletedIds||{};saveDeleted();
      if(o.affMap)saveAffMap(o.affMap);
      if(o.affTag){try{localStorage.setItem(AFF_KEY,o.affTag);}catch(e){}}
      closeModal();renderProducts();scheduleSync();
      toast("تم استيراد النسخة ✅");
    }catch(e){toast("ملف غير صالح ❌");}
  };
  rd.readAsText(f);
}

async function deleteAllProducts(){
  var n=getAll().length;

  var dev=devId();

    if(!confirm("إفراغ السوق المشترك بالكامل ("+n+")؟\nسيختفي من عند الجميع. لا يمكن التراجع."))return;

      await _sock.rpc.adminWipe("");
      var allFixed=[];for(var i=0;i<PRODUCTS.length;i++)allFixed.push(PRODUCTS[i].id);
      await _sock.rpc.adminFixed(JSON.stringify({edits:{},del:allFixed}));
    }catch(e){toast("تعذر: "+((e&&e.message)||e));return;}
    _s={items:{},views:{},tombIds:[],fixedEdits:{},fixedDel:allFixed,updatedAt:0};_tombSet={};
    customProducts=[];saveCustom();productEdits={};saveEdits();
    for(var j=0;j<PRODUCTS.length;j++)deletedIds[PRODUCTS[j].id]=true;
    saveDeleted();

    toast("تم إفراغ السوق من عند الجميع 🗑🌐");
  }else{
    var mineN=0;for(var id in _s.items)if(_s.items[id].owner===dev)mineN++;
    var had=customProducts.length+mineN;
    if(!confirm("حذف منتجاتك ("+had+") من السوق ومن جهازك؟\nمنتجات الآخرين ستبقى."))return;
    if(_sock&&_sockOk){
